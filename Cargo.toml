[package]
name = "treedb"
version = "0.10.0"
edition = "2021"
description = "元数据引擎：单进程事件循环 + 自定义二进制协议 + WAL/checkpoint（POSIX 元数据语义，客户端无关）"
license = "Apache-2.0"

[lib]
name = "treedb"
path = "src/lib.rs"

[[bin]]
name = "treedb-demo"
path = "src/bin/demo.rs"
# demo 演示的是过渡档（schema 编码 / 镜像 / 密钥表），引擎本体验收不靠它。
required-features = ["postgres-compat"]

[[bin]]
name = "treedb-server"
path = "src/bin/server.rs"

# 只读副本：pull 式日志传送（§6.6）。它不是一个独立的服务端实现，而是
# `serve` 加了一份 `replication` 配置 —— 所以协议、帧、apply 路径两边共用。
[[bin]]
name = "treedb-standby"
path = "src/bin/standby.rs"

# 快照升级：把上一代布局的数据目录搬到当前布局（只动 state.snap，不动 WAL）。
# 有旧数据目录的人唯一的出路，所以它必须是装完就有的命令，不是要另编的脚本。
[[bin]]
name = "treedb-migrate"
path = "src/bin/migrate.rs"

# 离线搬运：逻辑 dump 与重建（§6.7）。与 migrate 的分工是「内部布局」对
# 「逻辑内容」—— migrate 只能喂同一代二进制，dump 只依赖日志标签（1..=22）。
# 两个命令共用 `engine::dump`，一写一读，是这对工具的完整闭环。
[[bin]]
name = "treedb-dump"
path = "src/bin/dump.rs"

[[bin]]
name = "treedb-load"
path = "src/bin/load.rs"

# 时间点恢复（§6.11）：把 server --archive-dir 攒下的 WAL 归档 + 活日志重放到
# 任意一个已归档的水位，落成一个新数据目录。与 load 的分工是「日志粒度」对
# 「dump 粒度」—— load 只能回到导出的那一刻，pitr 能回到归档覆盖的任意一条。
[[bin]]
name = "treedb-pitr"
path = "src/bin/pitr.rs"

# 在线导出：dump 读本地目录、要目录独占；backup 读在线主，两条腿都是主已经
# 实现的只读 op（SnapFetch + WalFetch），所以主不停机也能拿到一致切面。
# 产出与 dump 同格式（TDBDUMP2），`treedb-load` 直接吃得下。
[[bin]]
name = "treedb-backup"
path = "src/bin/backup.rs"

[[bin]]
name = "treedb-bench"
path = "src/bin/bench.rs"

# 人工操作入口：通用表的全套 CRUD + 统计 + 离线工具的统一转发（§5.1、§11 的工具面
# 缺口）。逻辑在 src/cli/，这里只是壳 —— 集成测试要能在同进程里调 treedb::cli::main
# 拿退出码，bin 里的代码不是库面、测不到。
[[bin]]
name = "treedb-cli"
path = "src/bin/cli.rs"

# 吞吐对照：同一套 op 打到 PG，给引擎数字装配母分母。
[[bin]]
name = "treedb-pgbench"
path = "src/bin/pgbench.rs"
required-features = ["postgres-compat"]

# 第二个母分母：同一套 op 打到 SQLite3（页缓存 + WAL + synchronous=FULL）。
# 只有 PG 一个分母时，「treedb 快」里混着「PG 的进程模型重」这层归因；
# SQLite 落在两者之间，三臂齐了才分得开引擎效率与进程模型。
[[bin]]
name = "treedb-sqlitebench"
path = "src/bin/sqlitebench.rs"
required-features = ["postgres-compat"]

# 计算侧微基准：不经网络、不写 WAL，只量状态机本身的 ns/op 与 allocs/op。
# 吞吐矩阵落后 PG 的格子先在这里复现，才知道该改索引还是该改线程模型。
[[bin]]
name = "treedb-micro"
path = "src/bin/micro.rs"

[features]
# 显式写成一行：`tests/independence.rs` 门 3 就在测这个键没把过渡档拖进默认档。
default = []
# 默认空：`cargo build` 出来的是纯引擎，依赖只有 libc + thiserror。
# 过渡档（PG 共享池 + SQLite 镜像 + grovefs_control 表形）全部关在这里，
# 它服务的是 grovefs 现有的 PostgreSQL 栈，不是元数据引擎本体。
# 打开它才会把下面标 optional 的 7 个依赖拉进构建图。
postgres-compat = [
    "dep:postgres",
    "dep:rusqlite",
    "dep:parking_lot",
    "dep:uuid",
    "dep:sha2",
    "dep:chrono",
    "dep:tracing",
]

[dependencies]
# --- engine（自研引擎本体）：只依赖 libc + thiserror + 标准库 ---
libc = "0.2"
thiserror = "1"

# --- 过渡档：PG 共享池 + SQLite 镜像（grovefs 现有栈，接入期保留）---
# 全部 optional，由 `postgres-compat` 拉起（见上）。为什么不能默认开：
# 一个要被人当依赖引的数据库，不该因为 `pool/store/persist/schema` 这四个
# 模块就把 PG 客户端和一个编译期 SQLite 塞进下游的构建图。
postgres = { version = "0.19", default-features = false, optional = true }
rusqlite = { version = "0.31", features = ["bundled"], optional = true }
parking_lot = { version = "0.12", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
sha2 = { version = "0.11.1", optional = true }
chrono = { version = "0.4", optional = true }
tracing = { version = "0.1", optional = true }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
